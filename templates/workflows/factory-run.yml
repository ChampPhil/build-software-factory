# factory-run — orchestrates one pipeline.
#
# The roles are gh-aw workflow_call reusable workflows, called here as jobs
# (spike §3). Actions sequences them with `needs:`, so nothing polls and no job
# is billed while waiting for another. Each role is its own job on its own
# runner, which is what makes the builder/verifier transcript isolation
# structural rather than a rule bsf has to keep.
#
# Gate retries are this workflow re-dispatching itself for attempt n+1, so each
# attempt's cost is billed and reported separately.
name: factory-run

on:
  workflow_dispatch:
    inputs:
      work_item:
        description: Work item id
        required: true
        type: string
      attempt:
        description: Gate attempt, 1..retry_cap
        required: false
        default: '1'
        type: string
      pr_number:
        description: Set from attempt 2 onward; for a conflict rebuild, the conflicting PR
        required: false
        default: '0'
        type: string
      reason:
        description: "'conflict' rebuilds the item's PR on the current main, as a new PR that replaces it"
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # Capped by factory.yaml concurrency.max_runs, well under GitHub Free's 20
  # concurrent jobs. One group per work item so a retry never races itself.
  group: factory-run-${{ inputs.work_item }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      model_triage: ${{ steps.models.outputs.model_triage }}
      model_spec: ${{ steps.models.outputs.model_spec }}
      model_builder: ${{ steps.models.outputs.model_builder }}
      model_hardener: ${{ steps.models.outputs.model_hardener }}
      needs_hardener: ${{ steps.plan.outputs.needs_hardener }}
      needs_spec: ${{ steps.plan.outputs.needs_spec }}
      pipeline: ${{ steps.plan.outputs.pipeline }}
      protected_files_policy: ${{ steps.plan.outputs.protected_files_policy }}
      needs_triage: ${{ steps.plan.outputs.needs_triage }}
      skip_triage: ${{ steps.plan.outputs.skip_triage }}
      brainstorm_open: ${{ steps.plan.outputs.brainstorm_open }}
      # Proceed only once the run has claimed the item: a run that could not
      # (the item was already taken, or escalated) starts no role.
      proceed: ${{ steps.start.outputs.run_id != '' && steps.plan.outputs.proceed == 'true' }}
      run_id: ${{ steps.start.outputs.run_id }}
      host_access: ${{ steps.plan.outputs.host_access }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Read each role's model from factory.yaml
        id: models
        run: bsf models
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app,model
      - name: Mint a down-scoped token for this job
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          # Scoped to this repository: an App token otherwise reaches every repo
          # the installation covers.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Reads the work item and policy.yaml, and resolves this pipeline's
      # gh-aw protected-files policy and path allowlist.
      - name: Plan this run
        id: plan
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
          ATTEMPT: ${{ inputs.attempt }}
          REASON: ${{ inputs.reason }}
        run: bsf run plan "$WORK_ITEM" --attempt "$ATTEMPT" --reason "$REASON"
      - name: Mint a token for claiming the work item
        id: write-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Before any model runs. A name with no decision leaves this item queued.
      - name: Settings still waiting
        id: env
        env:
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          INPUTS: ${{ toJson(github.event.inputs) }}
        run: |
          if bsf env scan --hold factory-run.yml --inputs "$INPUTS"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      # Moves the item off queued, so intake and rollup stop dispatching it,
      # and records the run as live, which is what the concurrency cap counts.
      # Not when the budget cannot cover this run's largest step: the item
      # stays queued, unclaimed, and dispatch leaves it until it fits.
      - name: Claim the work item for this run
        id: start
        if: steps.plan.outputs.budget_wait != 'true' && steps.env.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
          ATTEMPT: ${{ inputs.attempt }}
          ESCALATE: ${{ steps.plan.outputs.escalate }}
          FIRST_STEP: ${{ steps.plan.outputs.first_step }}
          REASON: ${{ inputs.reason }}
          PR: ${{ inputs.pr_number }}
        run: bsf run start "$WORK_ITEM" --attempt "$ATTEMPT" --escalate "$ESCALATE" --first-step "$FIRST_STEP" --reason "$REASON" --pr "$PR"

  triage:
    needs: plan
    if: needs.plan.outputs.needs_triage == 'true' && needs.plan.outputs.proceed == 'true'
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run; derived from the lock
    # file and checked by a test, so a gh-aw upgrade cannot silently break it.
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-role-triage.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-triage
      model: ${{ needs.plan.outputs.model_triage }}
      work_item: ${{ inputs.work_item }}
      pipeline: ${{ needs.plan.outputs.pipeline }}
      attempt: ${{ fromJSON(inputs.attempt) }}
    secrets: inherit

  # Triage writes its outcome onto the work item. Only "proceed" leaves it
  # running; needs-info, out-of-scope and duplicate stop the run here.

  # Charge triage's budget hold with what gh-aw measured, before the next
  # agent step can start.
  triage-budget:
    needs: triage
    if: always() && needs.triage.result != 'skipped'
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-triage
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  # A failed triage must not look like success, and a triage that only failed
  # in gh-aw's closing report must not stop the run. When triage decides to
  # proceed it has nothing to emit, so gh-aw's conclusion job reports it
  # "could not complete" and the whole called workflow fails although the
  # agent finished. This job looks at the jobs, and either lets the run carry
  # on (recovered) or queues the item again through the requeue counter.
  triage-failed:
    needs: [plan, triage, triage-budget]
    if: always() && needs.triage.result == 'failure'
    runs-on: ubuntu-latest
    outputs:
      recovered: ${{ steps.fail.outputs.recovered }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app
      - name: Mint a token for the work item and its issue
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-actions: read
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Recover, or queue the item again
        id: fail
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
        run: bsf run fail-step "$WORK_ITEM" --step triage

  triaged:
    needs: [plan, triage, triage-budget, triage-failed]
    if: always() && (needs.triage.result == 'success' || needs.triage-failed.outputs.recovered == 'true')
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.status.outputs.proceed }}
      # A request triage could not pin down used to end the run. Now it starts
      # a conversation, in this same run: the person answers in seconds and the
      # run carries straight on to spec, instead of the whole thing being
      # dispatched again for every turn.
      wants_conversation: ${{ steps.status.outputs.wants_conversation }}
      understood: ${{ steps.status.outputs.understood }}
    steps:
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app
      - name: Mint a token for reading the work item
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Read what triage decided
        id: status
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
        run: bsf run status "$WORK_ITEM"

  # The conversation, held open as one job.
  #
  # A turn used to be a whole workflow run: a comment woke intake, intake
  # requeued the item, a role started from scratch and built a sandbox it never
  # used in order to ask one question. Three to five minutes a turn, which is
  # correspondence rather than conversation. Here the agent blocks on
  # `bsf brainstorm wait` between questions, so a turn costs the model call and
  # nothing else — and it is cheaper, because a held job is billed as one job
  # where a run per turn is billed per job and each one rounds up to a minute.
  #
  # It is its own role rather than part of triage because triage starts the
  # sandbox to reproduce bugs, and that needs FACTORY_SANDBOX_ENV. A role whose
  # whole job is talking to somebody should never be handed the app's secrets.
  brainstorm:
    needs: [plan, triage, triaged, triage-budget]
    if: >-
      always() && needs.plan.outputs.proceed == 'true' &&
      (needs.triaged.outputs.wants_conversation == 'true' || needs.plan.outputs.brainstorm_open == 'true')
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run.
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-role-brainstorm.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-brainstorm
      model: ${{ needs.plan.outputs.model_triage }}
      work_item: ${{ inputs.work_item }}
      pipeline: ${{ needs.plan.outputs.pipeline }}
      attempt: ${{ fromJSON(inputs.attempt) }}
    secrets: inherit

  # Charge the conversation's budget hold with what gh-aw measured.
  brainstorm-budget:
    needs: brainstorm
    if: always() && needs.brainstorm.result != 'skipped'
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-brainstorm
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  # Did the conversation settle? Only then does the run go on to spec. A
  # conversation that ended because the person walked away leaves the item
  # where it was, and their next comment picks it up from there.
  brainstormed:
    needs: [brainstorm, brainstorm-budget]
    if: always() && needs.brainstorm.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      understood: ${{ steps.status.outputs.understood }}
    steps:
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app
      - name: Mint a token for reading the work item
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Read what the conversation settled
        id: status
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
        run: bsf run status "$WORK_ITEM"

  # Hardening starts here instead of at triage: its intent comes from a found
  # weakness, not a request. Nothing called this role before, so the hardening
  # pipeline that run-plan describes could not run.
  hardener:
    needs: plan
    if: needs.plan.outputs.needs_hardener == 'true' && needs.plan.outputs.proceed == 'true'
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run; derived from the lock
    # file and checked by a test, so a gh-aw upgrade cannot silently break it.
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-role-hardener.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-hardener
      model: ${{ needs.plan.outputs.model_hardener }}
      work_item: ${{ inputs.work_item }}
      pipeline: ${{ needs.plan.outputs.pipeline }}
      attempt: ${{ fromJSON(inputs.attempt) }}
      protected_files_policy: ${{ needs.plan.outputs.protected_files_policy }}
    secrets: inherit

  # Charge hardener's budget hold with what gh-aw measured, before the next
  # agent step can start.
  hardener-budget:
    needs: hardener
    if: always() && needs.hardener.result != 'skipped'
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-hardener
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  spec:
    needs: [plan, triage, triaged, brainstorm, brainstormed, hardener, triage-budget, brainstorm-budget, hardener-budget]
    if: >-
      always() && needs.plan.outputs.proceed == 'true' && needs.plan.outputs.needs_spec == 'true' &&
      (needs.triage.result == 'skipped' || needs.triaged.outputs.proceed == 'true' ||
       needs.brainstormed.outputs.understood == 'true') &&
      (needs.plan.outputs.brainstorm_open != 'true' || needs.brainstormed.outputs.understood == 'true') &&
      (needs.brainstorm.result == 'skipped' || needs.brainstorm.result == 'success') &&
      (needs.hardener.result == 'success' || needs.hardener.result == 'skipped') &&
      needs.hardener.outputs.created_pr_number == ''
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run; derived from the lock
    # file and checked by a test, so a gh-aw upgrade cannot silently break it.
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-role-spec.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-spec
      model: ${{ needs.plan.outputs.model_spec }}
      work_item: ${{ inputs.work_item }}
      pipeline: ${{ needs.plan.outputs.pipeline }}
      attempt: ${{ fromJSON(inputs.attempt) }}
    secrets: inherit

  # Runs when spec ran, and also when the pipeline has no spec step at all
  # (conflict, gardening). A failed spec still stops it.

  # Charge spec's budget hold with what gh-aw measured, before the next
  # agent step can start.
  spec-budget:
    needs: spec
    if: always() && needs.spec.result != 'skipped'
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-spec
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  build:
    needs: [plan, triage, triaged, spec, triage-budget, spec-budget]
    if: >-
      always() && needs.plan.outputs.proceed == 'true' &&
      (needs.triage.result == 'skipped' || needs.triaged.outputs.proceed == 'true') &&
      (needs.spec.result == 'success' || (needs.spec.result == 'skipped' && needs.plan.outputs.needs_spec != 'true')) &&
      needs.plan.outputs.host_access != 'true'
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run; derived from the lock
    # file and checked by a test, so a gh-aw upgrade cannot silently break it.
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-role-builder.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-build
      model: ${{ needs.plan.outputs.model_builder }}
      work_item: ${{ inputs.work_item }}
      pipeline: ${{ needs.plan.outputs.pipeline }}
      attempt: ${{ fromJSON(inputs.attempt) }}
      # A rebuild opens a new PR; the conflicting one only names what to rebuild.
      pr_number: ${{ fromJSON(inputs.reason == 'conflict' && '0' || inputs.pr_number) }}
      protected_files_policy: ${{ needs.plan.outputs.protected_files_policy }}
    secrets: inherit

  # The same builder, compiled with host access: chosen when the frozen
  # manifest needs the runner (services, or stubs at a third party's own
  # address), so the app runs there and the agent can look at it. Weaker
  # isolation, which is why it is a separate workflow and never the default.

  # Charge build's budget hold with what gh-aw measured, before the next
  # agent step can start.
  build-budget:
    needs: build
    if: always() && needs.build.result != 'skipped'
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-build
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  build-host:
    needs: [plan, triage, triaged, spec, triage-budget, spec-budget]
    if: >-
      always() && needs.plan.outputs.proceed == 'true' &&
      (needs.triage.result == 'skipped' || needs.triaged.outputs.proceed == 'true') &&
      (needs.spec.result == 'success' || (needs.spec.result == 'skipped' && needs.plan.outputs.needs_spec != 'true')) &&
      needs.plan.outputs.host_access == 'true'
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run; derived from the lock
    # file and checked by a test, so a gh-aw upgrade cannot silently break it.
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-role-builder-host.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-build-host
      model: ${{ needs.plan.outputs.model_builder }}
      work_item: ${{ inputs.work_item }}
      pipeline: ${{ needs.plan.outputs.pipeline }}
      attempt: ${{ fromJSON(inputs.attempt) }}
      # A rebuild opens a new PR; the conflicting one only names what to rebuild.
      pr_number: ${{ fromJSON(inputs.reason == 'conflict' && '0' || inputs.pr_number) }}
      protected_files_policy: ${{ needs.plan.outputs.protected_files_policy }}
    secrets: inherit

  # The builder's safe output pushes with the factory App's token, which starts
  # factory-gates on the branch as a separate workflow. This job waits only for
  # the gate *results*, which are keyed by commit, and decides what happens next.

  # Charge build-host's budget hold with what gh-aw measured, before the next
  # agent step can start.
  build-host-budget:
    needs: build-host
    if: always() && needs.build-host.result != 'skipped'
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-build-host
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  after-gates:
    # The hardener builds its rule and opens the PR itself (its prompt asks
    # for the rule, its proof and the violations fixed); spec and build are
    # then skipped, and the run finishes with the hardener's PR.
    needs: [plan, triage-failed, hardener, build, build-host, hardener-budget, build-budget, build-host-budget]
    # Runs whatever the build did, so the item always leaves "running". It no
    # longer waits for the gates: it hands the run over and factory-gates'
    # decide job finishes it when they report (fix 6).
    # A triage that failed and was queued again by triage-failed already told
    # the person and counted the attempt; this job must not do both again.
    if: always() && needs.plan.outputs.proceed == 'true' && needs.triage-failed.outputs.recovered != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read for this run's StepReport artifacts.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app
      - name: Mint a token for reading checks and dispatching
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          # write: factory/pr-report.
          permission-checks: write
          permission-actions: write
          permission-issues: write
          permission-pull-requests: write
          # Scoped to this repository: an App token otherwise reaches every repo
          # the installation covers.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Waits for factory/gates on the PR's head, then: on a pass, marks the PR
      # ready and labels it factory:cleared; on a failure under the retry cap,
      # stores the failures on the data ref and re-dispatches factory-run with
      # attempt+1; at the cap, escalates. The rollup that follows dispatches
      # the next queued item, so the queue drains without a timer.
      # Each role uploaded its StepReport (model, tokens, cost) as an artifact
      # of this run; the run record that after-gates writes is made from them.
      - name: Fetch the roles' StepReports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: step-report-*
          path: ${{ runner.temp }}/step-reports
      # The PR body is rendered from the roles' reports, never taken from an
      # agent: once now with the builder's, again when the verifier's is in.
      - name: Show the builder's report on the PR
        if: needs.build.outputs.created_pr_number != '' || needs.build-host.outputs.created_pr_number != '' || needs.hardener.outputs.created_pr_number != '' || inputs.pr_number != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
          PR: ${{ needs.build.outputs.created_pr_number || needs.build-host.outputs.created_pr_number || needs.hardener.outputs.created_pr_number || inputs.pr_number }}
        run: bsf report publish --work-item "$WORK_ITEM" --pr "$PR"
      - name: Hand the run to the gates, or decide now if they are already in
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
          ATTEMPT: ${{ inputs.attempt }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          PR: ${{ needs.build.outputs.created_pr_number || needs.build-host.outputs.created_pr_number || needs.hardener.outputs.created_pr_number || inputs.pr_number }}
          BUILD_RESULT: ${{ needs.build.result != 'skipped' && needs.build.result || needs.build-host.result }}
        run: >-
          bsf run after-gates "$WORK_ITEM" --run-id "$RUN_ID" --attempt "$ATTEMPT" --pr "$PR"
          --build-result "$BUILD_RESULT" --steps-dir "$RUNNER_TEMP/step-reports" --wait-min 0
      - name: Show the verifier's evidence on the PR
        if: always() && (needs.build.outputs.created_pr_number != '' || needs.build-host.outputs.created_pr_number != '' || needs.hardener.outputs.created_pr_number != '' || inputs.pr_number != '0')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
          PR: ${{ needs.build.outputs.created_pr_number || needs.build-host.outputs.created_pr_number || needs.hardener.outputs.created_pr_number || inputs.pr_number }}
        run: bsf report publish --work-item "$WORK_ITEM" --pr "$PR"

  # Whatever happened to the roles, the person who asked for this hears back.
  #
  # The live install's first feature request went silent: triage decided it
  # needed one question answered, recorded that on the work item, and then its
  # own job failed before the comment went out — so the author got an
  # acknowledgement and then nothing, for ever. Reading the recorded outcome in
  # a job that always runs is what makes that impossible. Idempotent, so it
  # costs nothing on a run that went fine.
  announce:
    # Every role's budget hold has to be settled before this runs, like any
    # other job that follows a role: the hold is released by the `-budget` job.
    needs:
      - plan
      - triage
      - triage-budget
      - triaged
      - brainstorm
      - brainstorm-budget
      - brainstormed
      - hardener
      - hardener-budget
      - spec
      - spec-budget
      - build
      - build-budget
      - build-host
      - build-host-budget
      - after-gates
    if: always() && inputs.work_item != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Say what happened, if nothing else has
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORK_ITEM: ${{ inputs.work_item }}
        run: bsf run announce "$WORK_ITEM"

  rollup:
    needs: [plan, after-gates]
    if: always()
    uses: ./.github/workflows/factory-rollup.yml
    secrets: inherit
