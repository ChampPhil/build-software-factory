# factory-journeys — the cheap look for one new journey.
#
# On a push to the default branch (a merge), and when someone runs it by
# hand. It does not rebuild the sandbox. It asks whether a person can now
# take a path the journey list cannot reach. No gap means it stops. One gap
# starts the setup workflow to drive that one journey, and only when setup
# is not already running.
name: factory-journeys

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: factory-journeys
  cancel-in-progress: false

jobs:
  look:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Look for one new journey
        id: look
        run: bsf journeys look
      - name: Ask setup to drive that one journey
        if: steps.look.outputs.gap != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GAP: ${{ steps.look.outputs.gap }}
        run: |
          set -euo pipefail
          busy=$(gh run list --workflow factory-setup.yml --status in_progress --limit 1 --json databaseId --jq 'length')
          if [ "$busy" != "0" ]; then
            echo "setup is already running"
            exit 0
          fi
          amend=$(jq -n --arg path "$GAP" '{focus:"one-journey", reaches:$path, why:"a page appeared that the journey list cannot reach"}')
          gh workflow run factory-setup.yml --ref "$GITHUB_REF_NAME" -f "amend=$amend"
