# The standard rules, on their own.
#
# Re-run this workflow when the rules patch fails. The patch is committed on
# factory/setup-state, beside the journey list.
name: factory-setup-rules

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      model_builder: ${{ steps.models.outputs.model_builder }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
      - name: Configuration names still waiting
        env:
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
        run: bsf env scan
      - name: Read each role's model from factory.yaml
        id: models
        run: bsf models
  seed:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Leave an empty earlier round so the computer can start
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/seed"
          echo "seed" > "$RUNNER_TEMP/seed/README"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seed-round-0
          path: ${{ runner.temp }}/seed
          if-no-files-found: error
  computer-b:
    name: Proving the standard rules
    needs: [plan, seed]
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-setup-agent.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-computer-b
      model: ${{ needs.plan.outputs.model_builder }}
      round: 9
      amend: '{"focus":"standards"}'
    secrets: inherit
  computer-b-budget:
    needs: computer-b
    if: always()
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-computer-b
      ran: ${{ needs.computer-b.result == 'skipped' && 'false' || 'true' }}
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
  save:
    needs: [computer-b, computer-b-budget]
    if: always() && needs.computer-b.result != 'skipped'
    permissions:
      contents: write
    uses: ./.github/workflows/factory-setup-save.yml
    with:
      artifact: setup-round-9
    secrets: inherit
