# The standard rules. Its own workflow, beside the journey list. A failure runs this workflow again.
name: factory-setup-rules

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-setup-rules
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      model_builder: ${{ steps.models.outputs.model_builder }}
      amend: ${{ steps.go.outputs.amend }}
      ready: ${{ steps.go.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app,model
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write
          permission-issues: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Plan this step
        id: go
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bsf setup plan --step rules
      - name: Read each role's model from factory.yaml
        id: models
        if: steps.go.outputs.ready == 'true'
        run: bsf models

  seed:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Leave an empty previous round
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/seed"
          echo "seed" > "$RUNNER_TEMP/seed/README"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seed-round-0
          path: ${{ runner.temp }}/seed
          if-no-files-found: error

  writer:
    name: Write the standard rules
    needs: [plan, seed]
    if: needs.plan.outputs.ready == 'true' && needs.seed.result == 'success'
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-setup-agent.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-writer
      model: ${{ needs.plan.outputs.model_builder }}
      round: 9
      amend: ${{ needs.plan.outputs.amend }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  writer-budget:
    needs: writer
    if: always()
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-writer
      ran: ${{ needs.writer.result == 'skipped' && 'false' || 'true' }}
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

  finish:
    name: Save the standard rules and start the recipe when the journeys are saved too
    needs: [writer, writer-budget]
    if: always() && needs.writer.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write
          permission-issues: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Download the writer's round
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: setup-round-9
          path: ${{ runner.temp }}/round
      - name: Save the round or start this step again
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bsf setup finish --step rules --from "$RUNNER_TEMP/round" --writer "${{ needs.writer.result }}"
