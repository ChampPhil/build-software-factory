# factory-review — the scheduled review.
#
# Scores recent runs against the rubrics, groups the failures, and files each
# problem as hardening work, which changes the codebase. It never changes the
# factory's own prompts, context or models, and it does not grade /practice
# runs (a person's own change) or file new work for failures found in hardening
# runs.
name: factory-review

on:
  schedule:
    # Daily check; the review itself runs on its cadence from factory.yaml, or
    # early if enough runs have piled up.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run the review now, whatever the cadence says
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

concurrency:
  group: factory-review
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      model_scorer: ${{ steps.models.outputs.model_scorer }}
      due: ${{ steps.check.outputs.due }}
      env_ready: ${{ steps.env.outputs.ready }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Read each role's model from factory.yaml
        id: models
        run: bsf models
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write
          # Scoped to this repository: an App token otherwise reaches every repo
          # the installation covers.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Before the scorer, which is the model. A waiting setting queues this run.
      - name: Settings still waiting
        id: env
        env:
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if bsf env scan --hold factory-review.yml --inputs '{"force":"${{ inputs.force }}"}'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      # Skips below the minimum run count, so a quiet week does not spend a
      # review's budget grading four runs.
      - name: Is a review due?
        id: check
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FORCE: ${{ inputs.force }}
        run: bsf review due --force "${FORCE:-false}"

  score:
    needs: due
    if: needs.due.outputs.due == 'true' && needs.due.outputs.env_ready == 'true'
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run; derived from the lock
    # file and checked by a test, so a gh-aw upgrade cannot silently break it.
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    uses: ./.github/workflows/factory-role-scorer.lock.yml
    with:
      budget_key: ${{ github.run_id }}-${{ github.run_attempt }}-score
      model: ${{ needs.due.outputs.model_scorer }}
      work_item: review
      pipeline: review
    secrets: inherit

  # Charge score's budget hold with what gh-aw measured, before the next
  # agent step can start.
  score-budget:
    needs: score
    if: always() && needs.score.result != 'skipped'
    permissions:
      contents: read
    uses: ./.github/workflows/factory-budget-settle.yml
    with:
      key: ${{ github.run_id }}-${{ github.run_attempt }}-score
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

