# Boot the recipe that is already on the setup branch.
#
# Re-run this workflow when the boot fails. It does not rewrite the recipe.
# The same recipe is not booted twice: a second boot of the same file stops
# and asks for the recipe workflow. The same failure twice opens one issue
# and stops.
name: factory-setup-boot

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: factory/setup-state
          fetch-depth: 0
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
      - name: Boot the recipe on the branch
        env:
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          recipe=.factory/setup-state/manifest.json
          if [ ! -f "$recipe" ]; then
            echo "There is no recipe on the setup branch. Run factory-setup-recipe first."
            exit 1
          fi
          bsf sandbox secrets --file "$recipe"
          sum=$(sha256sum "$recipe" | awk '{print $1}')
          if [ -f .factory/setup-state/booted.sha ] && [ "$(cat .factory/setup-state/booted.sha)" = "$sum" ]; then
            echo "This recipe was already booted. Run factory-setup-recipe, then boot the new one."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/trial"
          bsf sandbox trial --candidate "$recipe" --out "$RUNNER_TEMP/trial/trial.json" || true
          summary=$(jq -r '.summary // .reached // "boot failed"' "$RUNNER_TEMP/trial/trial.json")
          if [ -f .factory/setup-state/last-failure.txt ] && [ "$(cat .factory/setup-state/last-failure.txt)" = "$summary" ]; then
            gh issue create --title "Setup stopped" --body "The private copy failed the same way twice. Setup has stopped. The boot log is on the branch factory/setup-state." || true
            echo "The same failure happened twice. Setup has stopped."
            exit 1
          fi
          printf '%s\n' "$sum" > .factory/setup-state/booted.sha
          cp "$RUNNER_TEMP/trial/trial.json" .factory/setup-state/trial.json
          met=$(jq -r '.reached == .claimed' "$RUNNER_TEMP/trial/trial.json")
          if [ "$met" != "true" ]; then printf '%s\n' "$summary" > .factory/setup-state/last-failure.txt; fi
          git add .factory/setup-state
          git -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "Save the boot log"
          git push origin HEAD:factory/setup-state
          if [ "$met" != "true" ]; then
            echo "The boot did not meet the finish line. Run factory-setup-recipe with this log, then boot the new recipe."
            exit 1
          fi
