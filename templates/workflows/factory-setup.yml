# Setup starts here and hands each step its own workflow.
#
# The journey list and the standard rules run beside each other. The recipe
# starts when both are saved. A failed step is started again on its own,
# with the full reason. The same failure twice, or three failures in a row,
# stops. This file does not write the recipe.
name: factory-setup

on:
  push:
    branches: [main, master]
    paths:
      - '.factory/definition/**'
      - '.factory/bin/**'
  workflow_dispatch:
    inputs:
      amend:
        description: An inadequacy report (JSON), for an amendment; empty for first setup
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: factory-setup
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.go.outputs.ready }}
    steps:
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox/manifest.json
            .github/workflows
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Can setup start?
        id: go
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf setup ready --trusted .factory-trusted

  start:
    name: Start setup
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Stop if the credentials this job needs are missing
        env:
          HAS_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.FACTORY_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' }}
        run: bsf credentials check --need app,model
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write
          permission-issues: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Start the first steps
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
          AMEND: ${{ inputs.amend }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bsf setup start
