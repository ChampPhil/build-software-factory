# factory-conflicts — resolves a factory PR that main has moved under.
#
# A rebase is a code change, so it goes back through the gates like any other.
# The resolution never merges itself.
name: factory-conflicts

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: factory-conflicts
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      work_item: ${{ steps.scan.outputs.work_item }}
      conflicts: ${{ steps.scan.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-actions: write
      # Files one conflict work item per conflicting factory PR. A PR that is
      # merely behind main is not a conflict: the merge queue updates those.
      - name: Find factory PRs that now conflict
        id: scan
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: bsf conflicts scan

  resolve:
    needs: find
    if: needs.find.outputs.conflicts != '0'
    uses: ./.github/workflows/factory-run.yml
    with:
      work_item: ${{ needs.find.outputs.work_item }}
    secrets: inherit
