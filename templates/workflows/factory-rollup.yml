# factory-rollup — rebuilds the index and the ledger, and starts the next
# queued work item.
#
# Every factory workflow ends here, plus a daily sweep. That second job is
# what stops a crashed or cancelled run from stalling the queue: the queue
# drains because every workflow ends by looking at it, with no timer involved.
name: factory-rollup

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # The daily sweep. The backstop, not the mechanism.
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: factory-rollup
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-actions: write
      - name: Rebuild the rollups and dispatch what there are slots for
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: bsf rollup
