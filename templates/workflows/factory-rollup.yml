# factory-rollup — rebuilds the index and the ledger, and starts the next
# queued work item.
#
# Every factory workflow ends here, plus a daily sweep. That second job is
# what stops a crashed or cancelled run from stalling the queue: the queue
# drains because every workflow ends by looking at it, with no timer involved.
name: factory-rollup

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # The daily sweep. The backstop, not the mechanism.
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: factory-rollup
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/bsf/"*
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-actions: write
          # Scoped to this repository: an App token otherwise reaches every repo
          # the installation covers.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Rebuild the rollups and dispatch what there are slots for
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: bsf rollup
      # The two records of spend must agree to the cent, and the month's
      # billed minutes are reported beside the dollars. A difference files a
      # factory-health item; neither stops the rollup.
      - name: Check the spend records agree
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          bsf budget verify
          bsf budget minutes
      # The every-couple-of-days backstop for the journey look. The push
      # workflow is the one that runs on a merge. This one only runs on the
      # daily sweep, and it does not rebuild the sandbox.
      - name: Look for one new journey
        if: github.event_name == 'schedule'
        id: journeys
        run: bsf journeys look
      - name: Ask setup to drive that one journey
        if: github.event_name == 'schedule' && steps.journeys.outputs.gap != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GAP: ${{ steps.journeys.outputs.gap }}
        run: |
          set -euo pipefail
          busy=$(gh run list --workflow factory-setup.yml --status in_progress --limit 1 --json databaseId --jq 'length')
          if [ "$busy" != "0" ]; then
            echo "setup is already running"
            exit 0
          fi
          amend=$(jq -n --arg path "$GAP" '{focus:"one-journey", reaches:$path, why:"a page appeared that the journey list cannot reach"}')
          gh workflow run factory-setup.yml --ref "$GITHUB_REF_NAME" -f "amend=$amend"
