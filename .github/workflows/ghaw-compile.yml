# Compiles every role and pipeline template with the real gh-aw compiler.
#
# Exists because the compiler had never run: the session that wrote the
# templates could not install Go or gh-aw's binaries, so everything was read off
# the schema. This is the check that the templates are what gh-aw accepts, and it
# runs on every change to them so they cannot drift back into being unverified.
name: gh-aw compile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["templates/workflows/**", "tests/live/workflows/**", ".github/workflows/ghaw-compile.yml", "runner/src/cli.ts"]
  # Every pull request, with no path filter: main requires this check, and a
  # required check that never starts leaves a pull request waiting forever.
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        # Pinned: the compiled locks are part of the release, so the compiler
        # that made them is too. factory-recompile pins the same version.
        # v1.2.2 put the safe-outputs checkout ahead of the App token it
        # uses, so no role could open a PR.
        run: |
          gh extension install github/gh-aw --pin v1.3.1
          gh aw version

      # gh aw compile works on .github/workflows of the repo it runs in, so the
      # templates are compiled inside a scratch repo rather than this one, where
      # compiling would also pick up this repo's own CI.
      - name: Compile the templates in a scratch repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p /tmp/scratch/.github/workflows
          cp templates/workflows/*.md /tmp/scratch/.github/workflows/
          cd /tmp/scratch
          git init -q && git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm scratch
          # --strict so warnings the runtime would later trip on fail here.
          #
          # --approve because this scratch repo has no earlier lock file, so
          # gh-aw's safe-update mode sees every secret as newly added. In a
          # user's repo that check stays on: a recompile that introduces a
          # secret the last one did not have is exactly what it should flag.
          gh aw compile --strict --approve --verbose 2>&1 | tee /tmp/compile.log

      # The live tests (tests/live): deliberate runs against the real
      # services, such as proving the credit cap stops an agent.
      - name: Compile the live tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          rm -rf /tmp/live && mkdir -p /tmp/live/.github/workflows
          cp tests/live/workflows/*.md /tmp/live/.github/workflows/
          (cd /tmp/live && git init -q && git config user.email ci@example.com && git config user.name ci \
            && git add -A && git commit -qm scratch && gh aw compile --strict --approve 2>&1 | tee /tmp/compile-live.log)

      - name: Lint the pipeline workflows against the compiled roles
        run: |
          cp templates/workflows/*.yml /tmp/scratch/.github/workflows/
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /tmp
          cd /tmp/scratch
          # Lint only what the templates authored; the lock files are gh-aw's.
          /tmp/actionlint -color $(ls .github/workflows/factory-*.yml | grep -v '\.lock\.yml$')

      # The compiled roles ship with the skill. Setup copies them into a
      # user's repo, so for the default engine and sandbox posture the user
      # never needs gh-aw installed; only a different engine or posture, both
      # compile-time literals, needs a recompile, which runs in their Actions.
      #
      # This used to commit the fresh locks to main after a merge. Main now
      # refuses a push that has not passed its checks, so the pull request has
      # to carry the right locks itself, and this step is what holds it to
      # that. A prompt-only change needs `node scripts/lock-hash.mjs --write`.
      # A change to a settings block needs the files in the artifact below.
      - name: The committed locks are what the compiler produces
        run: |
          mkdir -p /tmp/want/templates /tmp/want/live
          cp /tmp/scratch/.github/workflows/*.lock.yml /tmp/want/templates/
          cp /tmp/live/.github/workflows/*.lock.yml /tmp/want/live/
          stale=0
          diff -r templates/compiled /tmp/want/templates > /tmp/locks.diff || stale=1
          diff -r tests/live/compiled /tmp/want/live >> /tmp/locks.diff || stale=1
          if [ "$stale" = "1" ]; then
            head -c 20000 /tmp/locks.diff
            echo "::error::templates/compiled or tests/live/compiled is stale. For a prompt-only change run: node scripts/lock-hash.mjs --write. Otherwise copy the lock files from this run's ghaw-compiled artifact."
            exit 1
          fi
          echo "the committed locks match"

      - name: Keep the compiled output and the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghaw-compiled
          path: |
            /tmp/scratch/.github/workflows/*.lock.yml
            /tmp/live/.github/workflows/*.lock.yml
            /tmp/compile.log
          if-no-files-found: warn
