# Compiles every role and pipeline template with the real gh-aw compiler.
#
# Exists because the compiler had never run: the session that wrote the
# templates could not install Go or gh-aw's binaries, so everything was read off
# the schema. This is the check that the templates are what gh-aw accepts, and it
# runs on every change to them so they cannot drift back into being unverified.
name: gh-aw compile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["templates/workflows/**", ".github/workflows/ghaw-compile.yml", "runner/src/cli.ts"]
  pull_request:
    paths: ["templates/workflows/**", ".github/workflows/ghaw-compile.yml", "runner/src/cli.ts"]

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw
          gh aw version

      # gh aw compile works on .github/workflows of the repo it runs in, so the
      # templates are compiled inside a scratch repo rather than this one, where
      # compiling would also pick up this repo's own CI.
      - name: Compile the templates in a scratch repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p /tmp/scratch/.github/workflows
          cp templates/workflows/*.md /tmp/scratch/.github/workflows/
          cd /tmp/scratch
          git init -q && git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm scratch
          # --strict so warnings the runtime would later trip on fail here.
          #
          # --approve because this scratch repo has no earlier lock file, so
          # gh-aw's safe-update mode sees every secret as newly added. In a
          # user's repo that check stays on: a recompile that introduces a
          # secret the last one did not have is exactly what it should flag.
          gh aw compile --strict --approve --verbose 2>&1 | tee /tmp/compile.log

      # The pipeline workflows are plain Actions YAML, which gh-aw does not
      # check. actionlint does: expressions, `needs` and job-output references,
      # and every call into a reusable workflow against that workflow's declared
      # inputs and secrets — which is why it runs here, after the role lock
      # files it validates those calls against exist.
      - name: Lint the pipeline workflows against the compiled roles
        run: |
          cp templates/workflows/*.yml /tmp/scratch/.github/workflows/
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /tmp
          cd /tmp/scratch
          # Lint only what the templates authored; the lock files are gh-aw's.
          /tmp/actionlint -color $(ls .github/workflows/factory-*.yml | grep -v '\.lock\.yml$')

      # Ship the compiled roles with the skill. Setup copies these into a
      # user's repo, so for the default engine and sandbox posture the user
      # never needs gh-aw installed; only a different engine or posture, both
      # compile-time literals, needs a recompile, which runs in their Actions.
      # A push made with GITHUB_TOKEN starts no workflow, so this cannot loop.
      - name: Commit the compiled roles beside the templates
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p templates/compiled
          rm -f templates/compiled/*.lock.yml
          cp /tmp/scratch/.github/workflows/*.lock.yml templates/compiled/
          git add templates/compiled
          if git diff --cached --quiet; then echo "compiled roles unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Recompile the role templates with gh-aw $(gh aw version 2>/dev/null | head -1)"
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keep the compiled output and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghaw-compiled
          path: |
            /tmp/scratch/.github/workflows/*.lock.yml
            /tmp/compile.log
          if-no-files-found: warn
